<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>換日線 DATELINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap\">\
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100%; 
            /* ⚡ 密技：初始高度多給 60 像素，讓 iOS Safari 判定網頁可以滾動，以便稍後點擊時驅逐工具列 */
            height: calc(100dvh + 60px); 
            background: #000;
            display: flex; 
            align-items: center; 
            justify-content: center;
            /* ⚡ 允許初始縱向滾動，解鎖 iOS 絲滑滾動機制 */
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        
        #game-container canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <div id=\"game-container\"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>

    <script src="./js/scenes/StartScene.js"></script>
    <script src="./js/scenes/GameScene.js"></script>
    <script src="./js/scenes/MusicScene.js"></script>
    <script src="./js/scenes/CalibrationScene.js"></script>
    <script src="./js/scenes/TransitionScene.js"></script>

    <script src="./js/main.js"></script>

    <script>
        // 1. 封鎖雙指張開縮放網頁
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // 2. 封鎖 iOS 雙擊放大的預設瀏覽器行為
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            let now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
