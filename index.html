<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Game</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}

/* 遊戲畫面 */
canvas {
    display: block;
}

/* 橫式提示畫面 */
#rotateHint {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

/* 👉 橫式時隱藏提示 */
@media (orientation: landscape) {
    #rotateHint {
        display: none;
    }
}
</style>

</head>

<body>
<script src="main.js"></script>
<script>
window.addEventListener('load', () => {
    setTimeout(() => {
        window.scrollTo(0, 1);
    }, 100);
});
</script>
<div id="rotateHint">請將手機橫向遊玩</div>
</body>
</html>

</head>

<body>
  <script src="main.js"></script>
</body>
</html>
