<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>換日線 DATELINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100%; 
            /* ⚡ 關鍵修正一：給予足夠的滾動空間（80px），確保 iOS 判定為可滾動網頁，藉此驅逐工具列 */
            height: calc(100dvh + 80px); 
            background: #000;
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 📱 ⚡ 關鍵修正二：徹底解決全面屏 iPhone 橫向畫面右偏問題 */
        /* 建立一個強制填滿動態視窗的絕對容器，並強制內部的 Phaser Canvas 永遠絕對居中 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container canvas { 
            display: block !important; 
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>

    <script src="./js/scenes/StartScene.js"></script>
    <script src="./js/scenes/GameScene.js"></script>
    <script src="./js/scenes/MusicScene.js"></script>
    <script src="./js/scenes/CalibrationScene.js"></script>
    <script src="./js/scenes/TransitionScene.js"></script>

    <script src="./js/main.js"></script>

    <script>
        // 1. 封鎖雙指張開縮放網頁
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // 2. 封鎖 iOS 雙擊放大的預設瀏覽器行為
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            let now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
