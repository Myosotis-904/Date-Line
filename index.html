<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>換日線 DATELINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100%;
            /* ⚡ 橫螢幕大絕招：初始高度直接撐開，給予足夠的垂直溢出肉塊，強迫 iOS Safari 開放滾動權限 */
            height: calc(100dvh + 120px);
            background: #000;
            overflow-x: hidden;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 📱 ⚡ 橫螢幕置中定錨防偏容器 */
        #game-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            /* 保持乾淨的 100dvh 動態高度，確保與 Phaser 畫布高度一致 */
            height: 100dvh; 
        }

        /* 強制 Phaser 自動生成的 Canvas 永遠相對於可視區絕對置中，完全無視 iOS 瀏海安全區域推擠 */
        #game-container canvas { 
            display: block !important; 
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>

    <script src="./js/scenes/StartScene.js"></script>
    <script src="./js/scenes/GameScene.js"></script>
    <script src="./js/scenes/MusicScene.js"></script>
    <script src="./js/scenes/CalibrationScene.js"></script>
    <script src="./js/scenes/TransitionScene.js"></script>

    <script src="./js/main.js"></script>

    <script>
        // 1. 封鎖雙指張開縮放網頁 (Zoom 手勢)
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // 2. 封鎖 iOS 雙擊放大的預設瀏覽器行為
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            let now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
