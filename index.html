<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>換日線 DATELINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100%; 
            /* ⚡ 密技：初始高度多給 80px，讓行動裝置判定網頁可以滾動，以便稍後點擊時驅逐工具列 */
            height: calc(100dvh + 80px); 
            background: #000;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 📱 ⚡ 絕對定錨外層：徹底修正橫向畫面右偏、不對齊問題 */
        #game-container {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 100vw !important;
            height: 100dvh !important;
            transform: translate(-50%, -50%) !important;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🚀 核心修正：釋放 Canvas 控制權，刪除干涉 Phaser 引擎重算的 absolute !important 屬性 */
        #game-container canvas { 
            display: block !important; 
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>

    <script src="./js/scenes/StartScene.js"></script>
    <script src="./js/scenes/GameScene.js"></script>
    <script src="./js/scenes/MusicScene.js"></script>
    <script src="./js/scenes/CalibrationScene.js"></script>
    <script src="./js/scenes/TransitionScene.js"></script>

    <script src="./js/main.js"></script>

    <script>
        // 封鎖雙指張開縮放網頁
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // 封鎖 iOS 雙擊放大的預設瀏覽器行為
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            let now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
